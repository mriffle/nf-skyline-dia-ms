name: Nextflow Stub Runs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]

jobs:
  stub-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextflow-version: ['24.10.5', '25.10.4', '26.04.0']
        config: [
          'test-diann.config',
          'test-cascadia.config',
          'test-encyclopedia-narrow-gpf.config',
          'test-encyclopedia-wide-only.config',
          'test-diann-pdc.config',
          'test-carafe-multi.config',
          'test-carafe-dzip.config',
          'test-diann-ddir.config',
          'test-carafe-pdc.config',
          'test-skip-dia-search.config',
          'test-msconvert-only-pdc.config',
          'test-msconvert-only-local.config',
          'test-diann-multi-batch-metadata.config',
          'test-diann-minimize.config',
          'test-diann-panorama-upload.config',
          'test-diann-pdc-upload.config',
          'test-diann-pdc-gene-reports.config',
          'test-diann-upload-no-metadata.config',
          'test-diann-upload-import-skyline.config',
          'test-diann-upload-input-files.config',
          'test-msconvert-only-upload.config',
          'test-diann-pdc-batches.config',
          'test-diann-pdc-batches-messy.config',
          'test-diann-batch-multidir.config',
          'test-sampled-dup-names.config',
          'test-batch-name-whitespace.config',
          'test-diann-filename-glob.config'
        ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Run (nf ${{ matrix.nextflow-version }} / ${{ matrix.config }})
      env:
        NXF_VER: ${{ matrix.nextflow-version }}
      run: |
        echo "Installing Nextflow ${NXF_VER}:"
        curl -s https://get.nextflow.io | bash
        chmod +x nextflow
        # UPLOAD_FILE and IMPORT_SKYLINE declare `secret 'PANORAMA_API_KEY'`. Nextflow requires
        # a declared secret to exist before it will run the task, even under -stub-run where the
        # command that would use it never executes. Set a placeholder so the panorama.upload
        # configs can run; the value is never read.
        ./nextflow secrets set PANORAMA_API_KEY 'ci-stub-not-a-real-key'
        echo "Running Nextflow stub with config: ${{ matrix.config }}"
        ./nextflow run . -stub-run -c test-resources/${{ matrix.config }} -c test-resources/ci.config

    # Configs that upload to Panorama record what they would have uploaded and where. Compare
    # that against the checked-in manifest so any change to the upload set shows up here.
    # Configs with no expected manifest are skipped by the script.
    - name: Check Panorama uploads (${{ matrix.config }})
      run: test-resources/check-upload-manifest.sh ${{ matrix.config }}

  # Negative tests: configs that must fail fast with a clear, parameter-attributed error
  # message (see modules/utils.nf resolve_user_path / list_user_dir). Each entry asserts the
  # run exits non-zero AND that the expected message fragment appears in the output.
  negative-stub-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextflow-version: ['24.10.5', '25.10.4', '26.04.0']
        # NOTE: `case` is a real matrix axis, not `include:`. Two `include:` entries that both
        # set `config` overwrite each other instead of adding a case, which would silently drop
        # coverage as cases are added.
        case:
          - config: 'test-bad-chromatogram-dir.config'
            expect: 'Parameter `chromatogram_library_spectra_dir` resolved to the filesystem root'
          - config: 'test-batch-name-invalid.config'
            expect: 'Parameter `quant_spectra_dir` contains an invalid batch name'
          - config: 'test-batch-duplicate-files.config'
            expect: 'Parameter `quant_spectra_dir` resolved multiple spectra files with the same name'
          - config: 'test-pdc-batch-file-short-row.config'
            expect: 'Parameter `pdc.batch_file`: line 3 of'
          - config: 'test-pdc-batch-file-empty.config'
            expect: 'Parameter `pdc.batch_file` is set but empty'
          - config: 'test-batch-name-duplicate.config'
            expect: 'Parameter `quant_spectra_dir` contains the batch name'
          - config: 'test-vendor-raw-demultiplex.config'
            expect: 'Parameter `msconvert.do_demultiplex` cannot be true when `use_vendor_raw` is true'
          - config: 'test-msconvert-only-vendor-raw.config'
            expect: 'Parameter `msconvert_only` requires `use_vendor_raw` to be false'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Expect failure (nf ${{ matrix.nextflow-version }} / ${{ matrix.case.config }})
      env:
        NXF_VER: ${{ matrix.nextflow-version }}
        CONFIG: ${{ matrix.case.config }}
        # Passed via env (not inlined into the script) so backticks in the fragment are
        # treated as literal text rather than shell command substitution.
        EXPECT: ${{ matrix.case.expect }}
      run: |
        echo "Installing Nextflow ${NXF_VER}:"
        curl -s https://get.nextflow.io | bash
        chmod +x nextflow
        echo "Running negative stub with config: ${CONFIG} (expecting failure)"
        set +e
        output=$(./nextflow run . -stub-run -c "test-resources/${CONFIG}" -c test-resources/ci.config 2>&1)
        status=$?
        set -e
        echo "$output"
        if [ "$status" -eq 0 ]; then
          echo "::error::Expected a non-zero exit but the run succeeded."
          exit 1
        fi
        if ! echo "$output" | grep -qF "$EXPECT"; then
          echo "::error::Did not find expected message fragment: $EXPECT"
          exit 1
        fi
        echo "Negative test passed: failed as expected with the attributed error message."

  # Slack notifications must never fail a run. With slack.enabled = true, each case below sets
  # the SLACK_WEBHOOK_URL secret to something unusable (or leaves it unset) and expects the run
  # to succeed anyway, log a specific warning, and never print the secret's value. No request
  # leaves the runner, so this proves the failure paths only; delivery to a real Slack webhook
  # is checked by hand.
  slack-stub-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nextflow-version: ['24.10.5', '25.10.4', '26.04.0']
        # A real matrix axis, not `include:`, for the reason given in negative-stub-run.
        case:
          - name: 'secret not set'
            secret: ''
            expect: 'the Nextflow secret SLACK_WEBHOOK_URL is not set'
          - name: 'secret is not a URL'
            secret: 'not-a-url'
            expect: 'The Nextflow secret SLACK_WEBHOOK_URL is not a valid https URL'
          - name: 'webhook unreachable'
            secret: 'https://127.0.0.1:9/unreachable-ci-webhook'
            expect: 'was not sent: could not reach Slack'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Expect success with a warning (nf ${{ matrix.nextflow-version }} / ${{ matrix.case.name }})
      env:
        NXF_VER: ${{ matrix.nextflow-version }}
        SLACK_SECRET: ${{ matrix.case.secret }}
        EXPECT: ${{ matrix.case.expect }}
      run: |
        echo "Installing Nextflow ${NXF_VER}:"
        curl -s https://get.nextflow.io | bash
        chmod +x nextflow
        if [ -n "$SLACK_SECRET" ]; then
          ./nextflow secrets set SLACK_WEBHOOK_URL "$SLACK_SECRET"
        fi
        echo "Running stub with Slack enabled (expecting success and a warning)"
        set +e
        output=$(./nextflow run . -stub-run -c test-resources/test-slack-notifications.config -c test-resources/ci.config 2>&1)
        status=$?
        set -e
        echo "$output"
        if [ "$status" -ne 0 ]; then
          echo "::error::A Slack problem failed the run (exit $status)."
          exit 1
        fi
        if ! echo "$output" | grep -qF "$EXPECT"; then
          echo "::error::Did not find expected warning fragment: $EXPECT"
          exit 1
        fi
        if [ -n "$SLACK_SECRET" ]; then
          if echo "$output" | grep -qF "$SLACK_SECRET" || grep -qF "$SLACK_SECRET" .nextflow.log; then
            echo "::error::The SLACK_WEBHOOK_URL secret value was printed."
            exit 1
          fi
        fi
        echo "Slack test passed: the run succeeded and warned as expected."
